<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 90" fill="none">
  <!-- Mark (White on Dark) -->
  <g transform="translate(5, 5)">
    <!-- Outer Broken Circle -->
    <path
      d="M 60.8 27.2 A 32 32 0 1 1 43.2 8"
      stroke="#FFFFFF"
      stroke-width="6.4"
      stroke-linecap="round"
    />
    <!-- Stylized 'A' Left Apex -->
    <path
      d="M 20 58.4 L 37.6 19.2"
      stroke="#FFFFFF"
      stroke-width="6.4"
      stroke-linecap="round"
    />
    <!-- Success Green Checkmark -->
    <path
      d="M 28.8 40 L 38.4 53.6 L 68.8 19.2"
      stroke="#10B981"
      stroke-width="6.4"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>

  <!-- Wordmark: ATTEND (White) + X (Green) -->
  <text
    x="96"
    y="50"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif"
    font-size="36"
    font-weight="800"
    letter-spacing="0.15em"
    fill="#FFFFFF"
  >ATTEND<tspan fill="#10B981">X</tspan></text>

  <!-- Tagline Sub-group with Accent Lines -->
  <g transform="translate(97, 68)">
    <line x1="0" y1="-3" x2="16" y2="-3" stroke="#10B981" stroke-width="1.5" stroke-linecap="round" />
    <text
      x="22"
      y="0"
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif"
      font-size="8.5"
      font-weight="600"
      letter-spacing="0.16em"
      fill="#94A3B8"
    >PRESENT TODAY, PREPARED TOMORROW.</text>
    <line x1="250" y1="-3" x2="266" y2="-3" stroke="#10B981" stroke-width="1.5" stroke-linecap="round" />
  </g>
</svg>
