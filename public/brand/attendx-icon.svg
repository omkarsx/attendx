<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Rounded Deep Navy Squircle Base -->
  <rect width="120" height="120" rx="26" fill="#0F172A" />
  
  <!-- Centered Emblem (Scaled inside 120x120) -->
  <g transform="translate(16, 16)">
    <!-- Outer Broken Circle in White -->
    <path
      d="M 66.88 29.92 A 35.2 35.2 0 1 1 47.52 8.8"
      stroke="#FFFFFF"
      stroke-width="7.04"
      stroke-linecap="round"
    />
    <!-- Stylized 'A' Left Apex in White -->
    <path
      d="M 22 64.24 L 41.36 21.12"
      stroke="#FFFFFF"
      stroke-width="7.04"
      stroke-linecap="round"
    />
    <!-- Success Green Checkmark -->
    <path
      d="M 31.68 44 L 42.24 58.96 L 75.68 21.12"
      stroke="#10B981"
      stroke-width="7.04"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>
